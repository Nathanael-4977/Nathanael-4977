<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320">
  <defs>
    <!-- Filtre Ombre Portée 3D -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2" />
    </filter>
    
    <!-- Filtre Néon Vert -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Thème Sombre (Défaut) */
      .bg { fill: #090d13; }
      .text-main { fill: #c9d1d9; }
      .text-muted { fill: #8b949e; }
      .box { fill: #161b22; stroke: #3399FF; }
      
      /* Thème Clair (GitHub Light Mode) */
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .text-main { fill: #24292f; }
        .text-muted { fill: #57606a; }
        .box { fill: #f6f8fa; stroke: #3399FF; }
      }

      /* Animations (Chargement + Continu) */
      .fade-up { opacity: 0; transform: translateY(10px); animation: loadIn 0.6s ease-out forwards; }
      .delay-1 { animation-delay: 0.2s; }
      .delay-2 { animation-delay: 0.6s; }
      .delay-3 { animation-delay: 1.0s; }
      .delay-4 { animation-delay: 1.3s; }
      .delay-5 { animation-delay: 1.6s; }
      .delay-6 { animation-delay: 1.9s; }
      
      .pulse-green { animation: blinkGreen 2s infinite; }
      
      @keyframes loadIn { to { opacity: 1; transform: translateY(0); } }
      @keyframes blinkGreen { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #2ea043); } 50% { opacity: 0.5; filter: none; } }
    </style>
  </defs>

  <!-- Fond Adaptatif -->
  <rect width="100%" height="100%" class="bg" rx="8" />
  
  <!-- Grille Spatiale Statique -->
  <path d="M 0 40 L 850 40 M 0 80 L 850 80 M 0 120 L 850 120 M 0 160 L 850 160 M 0 200 L 850 200 M 0 240 L 850 240 M 0 280 L 850 280" stroke="#3399FF" stroke-width="0.5" opacity="0.05" />
  <path d="M 40 0 L 40 320 M 120 0 L 120 320 M 200 0 L 200 320 M 280 0 L 280 320 M 360 0 L 360 320 M 440 0 L 440 320 M 520 0 L 520 320 M 600 0 L 600 320 M 680 0 L 680 320 M 760 0 L 760 320" stroke="#3399FF" stroke-width="0.5" opacity="0.05" />
  
  <!-- Orbite Animée en Continu -->
  <g opacity="0.15">
    <ellipse cx="750" cy="180" rx="300" ry="100" fill="none" stroke="#3399FF" stroke-width="2" stroke-dasharray="20 10 5 10">
      <animateTransform attributeName="transform" type="rotate" from="0 750 180" to="360 750 180" dur="40s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="750" cy="180" r="150" fill="none" stroke="#3399FF" stroke-width="1" stroke-dasharray="2 6">
      <animateTransform attributeName="transform" type="rotate" from="360 750 180" to="0 750 180" dur="25s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Bordures Technologiques -->
  <rect x="2" y="2" width="846" height="316" fill="none" stroke="#3399FF" stroke-width="1" opacity="0.4" rx="8" />
  <rect x="15" y="15" width="820" height="290" fill="none" stroke="#3399FF" stroke-width="1" opacity="0.1" />
  
  <!-- En-tête du Panneau -->
  <g class="fade-up delay-1">
    <path d="M 15 15 L 250 15 L 270 45 L 15 45 Z" fill="#3399FF" opacity="0.15" />
    <path d="M 15 45 L 835 45" stroke="#3399FF" stroke-width="1" opacity="0.5" />
    <text x="35" y="33" fill="#3399FF" font-family="monospace" font-size="14" font-weight="bold">HUD // CREW_TELEMETRY</text>
    
    <!-- Statut Système Clignotant -->
    <circle cx="810" cy="30" r="4" fill="#2ea043" class="pulse-green" />
    <text x="735" y="34" class="text-muted" font-family="monospace" font-size="12">LINK: STABLE</text>
  </g>

  <!-- Texte Principal -->
  <g class="fade-up delay-2">
    <text x="40" y="90" class="text-main" font-family="sans-serif" font-size="24" font-weight="bold">Nathanaël Bousseau</text>
    <text x="40" y="115" class="text-muted" font-family="sans-serif" font-size="14" font-style="italic">"Training models to solve complex problems, from Earth to Orbit."</text>
  </g>
  
  <!-- Lignes de données avec Ombres -->
  <g class="fade-up delay-3" filter="url(#shadow)">
    <rect x="40" y="145" width="130" height="22" fill="#3399FF" opacity="0.15" rx="3" />
    <text x="48" y="161" fill="#3399FF" font-family="monospace" font-size="12" font-weight="bold">[BASE_STATION]</text>
    <text x="185" y="161" class="text-main" font-family="sans-serif" font-size="14">Engineering degree in AI. Erasmus exchange at Centria UAS (Finland).</text>
  </g>

  <g class="fade-up delay-4" filter="url(#shadow)">
    <rect x="40" y="185" width="130" height="22" fill="#3399FF" opacity="0.15" rx="3" />
    <text x="48" y="201" fill="#3399FF" font-family="monospace" font-size="12" font-weight="bold">[COMMAND_ROLE]</text>
    <text x="185" y="201" class="text-main" font-family="sans-serif" font-size="14">Treasurer and former President of the BDS. I protect the bank account.</text>
  </g>

  <g class="fade-up delay-5" filter="url(#shadow)">
    <rect x="40" y="225" width="130" height="22" fill="#3399FF" opacity="0.15" rx="3" />
    <text x="48" y="241" fill="#3399FF" font-family="monospace" font-size="12" font-weight="bold">[OFF_GRID]</text>
    <text x="185" y="241" class="text-main" font-family="sans-serif" font-size="14">Astrophotography, ice hockey, calisthenics, fingerpicking guitar.</text>
  </g>

  <g class="fade-up delay-6" filter="url(#shadow)">
    <rect x="40" y="265" width="130" height="22" fill="#3399FF" opacity="0.15" rx="3" />
    <text x="48" y="281" fill="#3399FF" font-family="monospace" font-size="12" font-weight="bold">[STRESS_TEST]</text>
    <text x="185" y="281" class="text-main" font-family="sans-serif" font-size="14">Kitchen assistant in Norwegian mountains (optimizing the dinner rush).</text>
  </g>
</svg>
