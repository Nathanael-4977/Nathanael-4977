<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 160" width="350" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <style>
      .bg { fill: #090d13; }
      .text-main { fill: #c9d1d9; }
      .tag-bg { fill: #161b22; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .text-main { fill: #24292f; }
        .tag-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1px; }
      }
      .pulse-green { animation: blinkGreen 2.5s infinite; }
      @keyframes blinkGreen { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #2ea043); } 50% { opacity: 0.5; filter: none; } }
    </style>
  </defs>

  <!-- Carte 3D -->
  <g filter="url(#shadow)">
    <rect width="98%" height="96%" x="1%" y="1%" class="bg" stroke="#3399FF" stroke-width="1" opacity="0.9" rx="6" />
    <rect x="10" y="10" width="323" height="25" fill="#3399FF" opacity="0.1" rx="4" />
    
    <text x="20" y="27" fill="#3399FF" font-family="monospace" font-size="12" font-weight="bold">MISSION 02: SUPPORT_BOT</text>
    <circle cx="318" cy="22" r="4" fill="#2ea043" class="pulse-green" />
    
    <text x="20" y="65" class="text-main" font-family="sans-serif" font-size="13">Automated AI customer support</text>
    <text x="20" y="85" class="text-main" font-family="sans-serif" font-size="13">workflow. Built a bot so</text>
    <text x="20" y="105" class="text-main" font-family="sans-serif" font-size="13">humans don't have to talk.</text>
    
    <rect x="20" y="125" width="303" height="22" class="tag-bg" rx="4" />
    <text x="28" y="140" fill="#2ea043" font-family="monospace" font-size="10">STATUS: Online and Completed</text>
  </g>
</svg>
