<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 40" width="350" height="40">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <style>
      .bg { fill: #090d13; }
      .text-muted { fill: #8b949e; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .text-muted { fill: #57606a; }
      }
      .arrow { animation: nudge 1.6s ease-in-out infinite; }
      @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
      .pulse-blue { animation: blinkBlue 2s infinite; }
      @keyframes blinkBlue { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #3399FF); } 50% { opacity: 0.5; filter: none; } }
    </style>
  </defs>

  <!-- Bouton 3D -->
  <g filter="url(#shadow)">
    <rect width="98%" height="86%" x="1%" y="2" class="bg" stroke="#3399FF" stroke-width="1" rx="6" />
    <rect x="8" y="6" width="334" height="26" fill="#3399FF" opacity="0.12" rx="4" />

    <circle cx="20" cy="19" r="4" fill="#3399FF" class="pulse-blue" />
    <text x="34" y="23" fill="#3399FF" font-family="monospace" font-size="12" font-weight="bold">ACCESS_REPOSITORY</text>
    <text x="196" y="23" class="text-muted" font-family="monospace" font-size="10">// view code</text>
    <text x="318" y="24" fill="#3399FF" font-family="monospace" font-size="15" font-weight="bold" class="arrow">&#8594;</text>
  </g>
</svg>
