<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180">
  <defs>
    <!-- Filtre Ombre Portée 3D -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
    
    <!-- Filtre Néon -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Thème Sombre */
      .bg { fill: #090d13; }
      .text-title { fill: #ffffff; font-family: sans-serif; font-size: 38px; font-weight: bold; letter-spacing: 1px; }
      .text-subtitle { fill: #c9d1d9; font-family: sans-serif; font-size: 16px; }
      .text-code { fill: #3399FF; font-family: monospace; font-size: 13px; font-weight: bold; }
      
      /* Thème Clair */
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .text-title { fill: #000000; }
        .text-subtitle { fill: #57606a; }
      }

      /* Animations */
      .fade-in { opacity: 0; animation: fadeIn 1s ease-out forwards; }
      .slide-right { opacity: 0; transform: translateX(-20px); animation: slideRight 0.8s ease-out forwards; }
      .delay-1 { animation-delay: 0.3s; }
      .delay-2 { animation-delay: 0.6s; }
      
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes slideRight { to { opacity: 1; transform: translateX(0); } }
    </style>
  </defs>

  <!-- Fond Transparent (Pas de cadre pour alléger l'en-tête) -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Logo Orbital Animé (Gauche) -->
  <g transform="translate(110, 90)" class="fade-in">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#3399FF" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="15" fill="none" stroke="#3399FF" stroke-width="2" filter="url(#glow-blue)" />
    <circle cx="0" cy="0" r="4" fill="#3399FF" />
    
    <!-- Anneaux tournants -->
    <g opacity="0.8">
      <ellipse cx="0" cy="0" rx="65" ry="20" fill="none" stroke="#3399FF" stroke-width="1.5" transform="rotate(30)">
        <animateTransform attributeName="transform" type="rotate" from="30" to="390" dur="10s" repeatCount="indefinite" />
      </ellipse>
      <ellipse cx="0" cy="0" rx="65" ry="20" fill="none" stroke="#3399FF" stroke-width="1.5" transform="rotate(-60)">
        <animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="15s" repeatCount="indefinite" />
      </ellipse>
      <!-- Point satellite -->
      <circle cx="65" cy="0" r="3" fill="#3399FF" filter="url(#glow-blue)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Bloc Texte (Droite) -->
  <g class="slide-right delay-1" filter="url(#shadow)">
    <!-- Titre Principal -->
    <text x="220" y="85" class="text-title">Nathanaël Bousseau</text>
    
    <!-- Ligne de séparation -->
    <path d="M 220 100 L 750 100" stroke="#3399FF" stroke-width="1" opacity="0.4" />
    <rect x="220" y="98.5" width="40" height="3" fill="#3399FF" filter="url(#glow-blue)" />
    
    <!-- Sous-titres -->
    <text x="220" y="125" class="text-subtitle">"Training models to solve complex problems, from Earth to Orbit."</text>
    
    <!-- Tag technique -->
    <rect x="220" y="140" width="338" height="22" fill="#3399FF" opacity="0.1" rx="4" />
    <text x="230" y="155" class="text-code">SYS.STATUS // 4th-Year AI Engineering @ ESAIP</text>
  </g>
</svg>
