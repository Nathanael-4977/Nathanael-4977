<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 40" width="350" height="40">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <style>
      .bg { fill: #090d13; }
      .text-muted { fill: #8b949e; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .text-muted { fill: #57606a; }
      }
    </style>
  </defs>

  <!-- Bouton desactive (aucun depot disponible) -->
  <g filter="url(#shadow)">
    <rect width="98%" height="86%" x="1%" y="2" class="bg" stroke="#d73a49" stroke-width="1" stroke-dasharray="4 3" opacity="0.8" rx="6" />
    <rect x="8" y="6" width="334" height="26" fill="#d73a49" opacity="0.08" rx="4" />

    <circle cx="20" cy="19" r="4" fill="none" stroke="#d73a49" stroke-width="1.5" />
    <text x="34" y="23" fill="#d73a49" font-family="monospace" font-size="12" font-weight="bold">REPOSITORY_OFFLINE</text>
    <text x="203" y="23" class="text-muted" font-family="monospace" font-size="10">// no signal</text>
  </g>
</svg>
